name: Deploy to PortaPaaS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
      - name: Signed PortaPaaS webhook
        env:
          PAAS_URL: ${{ secrets.PAAS_URL }}
          PAAS_SECRET: ${{ secrets.PAAS_SECRET }}
          APP_NAME: ${{ secrets.APP_NAME }}
        run: |
          python3 - <<'PY'
          import hashlib,hmac,json,os,time,urllib.request
          body=json.dumps({'app_name':os.environ['APP_NAME'],'image':os.environ['IMAGE'],'tag':os.environ['TAG']},separators=(',',':')).encode()
          ts=str(int(time.time())); sig=hmac.new(os.environ['PAAS_SECRET'].encode(),ts.encode()+b'.'+body,hashlib.sha256).hexdigest()
          req=urllib.request.Request(os.environ['PAAS_URL']+'/webhook/deploy',data=body,headers={'Content-Type':'application/json','X-Timestamp':ts,'X-Signature':sig})
          print(urllib.request.urlopen(req,timeout=30).read().decode())
          PY
